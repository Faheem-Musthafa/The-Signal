name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Generates Next route types, then type-checks src/, convex/ and tests/.
      # convex/_generated is committed, so no Convex codegen is needed here.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Clerk and Convex need real config at build time, so the build only runs
      # when the repo has these secrets (skipped on forks / unconfigured repos).
      - name: Check build secrets
        id: build-secrets
        env:
          CLERK_PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SK: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          if [ -n "$CLERK_PK" ] && [ -n "$CLERK_SK" ] && [ -n "$CONVEX_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Build secrets not configured; skipping next build."
          fi

      - name: Build
        if: steps.build-secrets.outputs.present == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
